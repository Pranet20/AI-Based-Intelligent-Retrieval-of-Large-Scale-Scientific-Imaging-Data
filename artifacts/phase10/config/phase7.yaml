phase: 7
experiment_id: "phase7_publication_benchmark_001"
title: "Publication-Grade Unified Benchmark, Ablation, Statistical Validation and Reproducibility"

immutability:
  frozen_checksums_path: "artifacts/phase7/pre_phase7_frozen_checksums.json"
  total_frozen_files: 84
  enforce_strict: true

research_questions:
  RQ1:
    question: "Can pretrained visual representations support robust scientific microscopy retrieval?"
    target_metric: "Recall@1, MRR, Precision@5"
    primary_comparator: "Random retrieval (B0), pHash (B1), dHash (B2) vs. DINOv2 ViT-B/14 (B3)"
    dataset: "HCCI (In-Domain), Carinthia (Cross-Domain)"
    evidence_tag: "[NATURAL DATA]"

  RQ2:
    question: "Does acquisition-aware representation improve robustness under acquisition changes?"
    target_metric: "Within-vs-cross acquisition cosine similarity gap, Cross/Within ratio, Held-out instrument R@1/P@5"
    primary_comparator: "Baseline DINOv2 vs. Phase 4 Acquisition-Aware Representation (Multi-Seed)"
    dataset: "HCCI (Cross-Acquisition, Held-out Zeiss Gemini)"
    evidence_tag: "[NATURAL DATA]"

  RQ3:
    question: "Does scientific metadata provide information beyond visual similarity, and under which benchmark conditions?"
    target_metric: "Delta R@1, Delta MRR, Delta Precision@K across visual-only vs. visual+metadata"
    primary_comparator: "Phase 2 Visual vs. Phase 5 Hybrid; Phase 4 Visual vs. Phase 5 Adapted Hybrid"
    dataset: "HCCI (Split: Val, Test, Full Corpus)"
    evidence_tag: "[NATURAL DATA]"

  RQ4:
    question: "Can the framework identify redundant images and potential data-quality issues?"
    target_metric: "Cascade F1, AUROC / AUPRC on synthetic degradations, Review-Queue Precision@K"
    primary_comparator: "pHash/dHash/Visual vs. 4-Stage Cascade; Quality Indicators vs. Degraded Ground Truth"
    dataset: "HCCI + Controlled Synthetic Benchmark"
    evidence_tag: "[CONTROLLED SYNTHETIC BENCHMARK]"

  RQ5:
    question: "How does the representation behave across different scientific microscopy domains?"
    target_metric: "Zero-shot retrieval, embedding separation, novelty score distribution"
    primary_comparator: "HCCI (In-Domain SEM) vs. Carinthia (Cross-Domain Light Microscopy) vs. External SEM archives"
    dataset: "HCCI, Carinthia, SEM Nanoscience, cigRockSEM, atomagined"
    evidence_tag: "[EXTERNAL DOMAIN SHIFT]"

  RQ6:
    question: "Does the integrated framework provide useful curation capabilities beyond image retrieval alone?"
    target_metric: "Duplicate pruning rate, quality-risk triage yield, provenance conflict flags"
    primary_comparator: "Unfiltered retrieval vs. Integrated Curation Pipeline"
    dataset: "HCCI"
    evidence_tag: "[ENGINEERING MEASUREMENT]"

  RQ7:
    question: "Can all reported experimental results be reproduced from frozen artifacts and an explicit experiment registry?"
    target_metric: "Bit-for-bit checksum match, 100% reproduction of metrics, automated CLI reproduction"
    primary_comparator: "Recorded Artifacts vs. Recomputed Metrics via CLI"
    dataset: "All Registered Datasets"
    evidence_tag: "[ENGINEERING MEASUREMENT]"

statistical_analysis:
  bootstrap_iterations: 1000
  confidence_level: 0.95
  random_seed: 42
  unit_of_analysis:
    retrieval: "query"
    pairwise_classification: "pair"

seeds:
  trainable_phase4: [42, 123, 2024]
