# Computational image-quality indicator thresholds
# Note: These metrics represent computational indicators, not absolute scientific ground truth.

# Thresholds for grading images into PASS, REVIEW, FAIL
thresholds:
  # Minimum Laplacian variance for focus sharpness
  min_laplacian_variance_pass: 50.0
  min_laplacian_variance_review: 15.0

  # Saturation ratio: fraction of pixels at maximum dynamic range value
  max_saturation_ratio_pass: 0.05
  max_saturation_ratio_review: 0.15

  # Dark-pixel ratio: fraction of pixels at zero / near-zero intensity
  max_dark_ratio_pass: 0.10
  max_dark_ratio_review: 0.30

  # Dynamic range ratio (max - min) / max_possible_range
  min_dynamic_range_ratio_pass: 0.20
  min_dynamic_range_ratio_review: 0.05

  # Shannon entropy: minimum information content in bits
  min_entropy_pass: 4.0
  min_entropy_review: 2.5

  # RMS contrast minimum
  min_contrast_pass: 15.0
  min_contrast_review: 5.0

# Indicator weightings for computing overall composite quality score (0.0 to 1.0)
weights:
  focus: 0.25
  contrast: 0.25
  dynamic_range: 0.20
  entropy: 0.20
  non_saturation: 0.10
