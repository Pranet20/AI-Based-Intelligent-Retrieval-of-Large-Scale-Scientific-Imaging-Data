version: "3.8"

services:
  postgres:
    image: postgres:15.6-alpine
    container_name: scidata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scidata_platform
      POSTGRES_USER: scidata_user
      POSTGRES_PASSWORD: scidata_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./artifacts/phase8/database_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scidata_user -d scidata_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: scientific-platform-api:v2.0.0
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.backend
    container_name: scidata-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scidata_user:scidata_secure_password_2026@postgres:5432/scidata_platform
      SECRET_KEY: scidata-super-secret-production-key-phase8-2026
      DINOV2_MODEL_NAME: dinov2_vits14
      DINOV2_EMBEDDING_DIM: 384
      EXPECTED_PHASE4_HASH: 53ba60a317a140ceaebdf2e152dea88fd78f2a8bffbec378fc14c84010fd0e62
      PYTHONPATH: platform/backend:.
    ports:
      - "8000:8000"
    volumes:
      - ./platform/storage:/app/platform/storage
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: scientific-platform-web:v2.0.0
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.frontend
    container_name: scidata-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
