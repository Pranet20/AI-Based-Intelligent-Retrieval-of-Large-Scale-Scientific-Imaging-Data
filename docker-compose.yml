services:
  postgres:
    image: postgres:15.6-alpine
    container_name: scidata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scidata_platform}
      POSTGRES_USER: ${POSTGRES_USER:-scidata_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scidata_secure_password_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./artifacts/phase8/database_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scidata_user} -d ${POSTGRES_DB:-scidata_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scidata_network

  backend:
    image: scientific-platform-api:v2.0.0
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.backend
    container_name: scidata-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-scidata_user}:${POSTGRES_PASSWORD:-scidata_secure_password_2026}@postgres:5432/${POSTGRES_DB:-scidata_platform}}
      SECRET_KEY: ${DOCKER_SECRET_KEY:-scidata-super-secret-production-key-phase8-2026}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TESTING: ${TESTING:-false}
      DINOV2_MODEL_NAME: dinov2_vits14
      DINOV2_EMBEDDING_DIM: 384
      EXPECTED_PHASE4_HASH: 53ba60a317a140ceaebdf2e152dea88fd78f2a8bffbec378fc14c84010fd0e62
      PYTHONPATH: /app:/app/app
    ports:
      - "8000:8000"
    volumes:
      - ./platform/storage:/app/platform/storage
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - scidata_network

  frontend:
    image: scientific-platform-web:v2.0.0
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.frontend
    container_name: scidata-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - scidata_network

volumes:
  postgres_data:

networks:
  scidata_network:
    driver: bridge
