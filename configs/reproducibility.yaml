# Reproducibility tracking configuration
random_seed: 42
track_packages:
  - "numpy"
  - "pandas"
  - "pillow"
  - "tifffile"
  - "imagehash"
  - "pyarrow"
  - "scipy"
  - "scikit-learn"
  - "h5py"
  - "matplotlib"
  - "click"
  - "pydantic"
  - "pyyaml"
track_git_state: true
track_hardware_info: true
