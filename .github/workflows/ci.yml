name: Scientific Platform Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  checksum-and-audit:
    name: Checksum & Research Immutability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify 128 Historical Frozen Checksums
        run: |
          python scripts/reproduce/final_validate_project.py --verify-only

  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Repository-Wide Secret Scan
        run: |
          python scripts/reproduce/run_secret_scan.py

  python-tests:
    name: Platform Regression Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest httpx pytest-github-actions-annotate-failures

      - name: Run Test Suite
        env:
          PYTHONPATH: .:platform/backend
        run: |
          set -o pipefail
          python -m pytest tests/ platform/tests/ -ra -v --tb=short 2>&1 | tee test_log.txt

      - name: Post Failure Diagnostics to Commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIAG_MSG=$(python3 -c "import sys, json; print(json.dumps({'body': '### CI Pytest Failure Diagnostic\n\`\`\`\n' + open('test_log.txt').read()[-3000:] + '\n\`\`\`'}))")
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -d "$DIAG_MSG" || true

  frontend-build:
    name: Frontend React Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Frontend Bundle
        run: |
          cd platform/frontend
          npm install
          CI=false npm run build

  container-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
