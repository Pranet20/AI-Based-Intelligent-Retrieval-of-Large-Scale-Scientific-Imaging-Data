[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scidata-platform"
version = "0.1.0"
description = "AI-Powered Scientific Image Data Management Platform for Metadata-Aware Retrieval, Quality Assessment, Deduplication and Anomaly Detection"
readme = "README.md"
requires-python = ">=3.11, <3.12"
authors = [
    { name = "Research Team" }
]
# Standardized Research Runtime: Python 3.11.x (Required for PyTorch/CUDA/DINOv2/FAISS stability in Phase 2+)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.25.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "tifffile>=2024.1.1",
    "imagehash>=4.3.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "h5py>=3.8.0",
    "matplotlib>=3.7.0",
    "openpyxl>=3.1.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "faiss-cpu>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
research = "src.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
