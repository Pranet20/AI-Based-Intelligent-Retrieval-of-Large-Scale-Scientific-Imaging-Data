# Phase 4: Acquisition-Aware Representation Learning Configuration
experiment_id: "phase4_acquisition_aware_representation_001"
phase: 4
platform_version: "0.1.0"

data:
  hcci_manifest: "data/manifests/hcci_manifest.parquet"
  hcci_embeddings: "data/processed/embeddings/hcci_dinov2_vits14_embeddings.parquet"
  output_dir: "data/processed/phase4"
  splits_dir: "data/processed/phase4/splits"
  checkpoints_dir: "data/processed/phase4/checkpoints"
  embeddings_dir: "data/processed/phase4/embeddings"
  metrics_dir: "data/processed/phase4/metrics"
  reports_dir: "reports/phase4"

splitting:
  strategy: "instrument_held_out"  # Helios (train) -> VEGA3 (val) -> Zeiss (test)
  train_instruments:
    - "Helios NanoLab"
    - "Helios G4 PFIB CXe"
  val_instruments:
    - "VEGA3 XMH"
  test_instruments:
    - "Zeiss Gemini"
  seed: 42

model:
  backbone_name: "dinov2_vits14"
  backbone_frozen: true
  input_dim: 384
  hidden_dim: 384
  output_dim: 384
  head_type: "mlp"  # mlp or linear
  dropout: 0.0
  normalize_output: true

loss:
  type: "acquisition_aware_supcon"
  temperature: 0.07
  mask_same_acquisition: true  # exclude same acquisition of same material from positive numerator

training:
  optimizer: "AdamW"
  lr: 0.0001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  batch_size: 64
  epochs: 40
  patience: 10
  eval_frequency: 1
  seeds:
    - 42
    - 123
    - 2024
  validation_metric: "cross_acquisition_r10"  # or "mrr"

evaluation:
  k_values: [1, 5, 10]
  eval_depth: 50
  exact_retrieval: true
